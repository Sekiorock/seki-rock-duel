<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#121212">
  <title>接続テスト｜セキオロックデュエル</title>
  <link rel="stylesheet" href="style.css?v=1.2.0">
</head>
<body>
  <!-- 接続テスト（仕様書 12章 v0.7）：Firebase に接続し、書き込みから読み出しまでの時間をはかる -->
  <section id="screen-test" class="screen scroll">
    <header class="topbar">
      <a class="sub-btn test-home" href="./" data-t="testHome">ゲームへ</a>
      <h2 class="screen-title" data-t="testTitle">接続テスト</h2>
      <div class="topbar-right">
        <button class="lang-btn" type="button" data-lang-toggle aria-label="言語 / Language"><span data-l="ja">JP</span><span data-l="en">EN</span></button>
      </div>
    </header>
    <p class="test-desc" data-t="testDesc"></p>
    <button id="btn-test" class="duel-btn test-run" type="button" data-t="testRun">テストを始める</button>
    <div id="test-rows" class="test-rows"></div>
    <p id="test-verdict" class="test-verdict"></p>
    <p id="version" class="version">v1.2.0</p>
  </section>
  <script type="module" src="src/nettest.js?v=1.2.0"></script>
</body>
</html>
