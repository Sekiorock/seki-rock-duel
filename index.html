<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#1B2A49">
  <meta name="format-detection" content="telephone=no">
  <title>セキオロックデュエル</title>
  <!-- ?v= は版番号。版が変わるたびに必ず新しいファイルを読み込ませるための印 -->
  <link rel="stylesheet" href="style.css?v=0.6.0">
  <script>
    // 読み込みに失敗したとき（古いファイルが混ざったときなど）に、白い画面のままにしない
    (function () {
      function fail() {
        if (window.__srdReady) return;
        var el = document.getElementById('boot-error');
        if (el) el.hidden = false;
      }
      window.addEventListener('error', function () { setTimeout(fail, 0); });
      window.addEventListener('unhandledrejection', function () { setTimeout(fail, 0); });
      window.addEventListener('load', function () { setTimeout(fail, 3000); });
    })();
  </script>
</head>
<body>
  <!-- タイトル画面 -->
  <section id="screen-title" class="screen">
    <div class="corner">
      <button id="rank-chip" class="rank-chip" type="button">
        <span data-t="rankLabel">段位</span><b id="rank-name">10級</b>
        <i class="rank-bar"><i id="rank-fill"></i></i>
      </button>
      <div class="corner-right">
        <button class="lang-btn" type="button" data-lang-toggle aria-label="言語 / Language"><span data-l="ja">JP</span><span data-l="en">EN</span></button>
        <button class="icon-btn" type="button" data-mute-toggle aria-label="音"></button>
      </div>
    </div>
    <div class="title-wrap">
      <canvas id="title-bombe" class="title-bombe" aria-hidden="true"></canvas>
      <h1 class="title" data-t="title">セキオロックデュエル</h1>
      <p class="title-en" data-t="titleEn">SEKIO ROCK DUEL</p>
      <button id="btn-exam-ready" class="exam-ready" type="button" data-t="examReady" hidden></button>
      <div class="menu-buttons">
        <button id="btn-dojo" class="menu-btn primary" type="button">
          <b data-t="dojo">道場</b><small data-t="dojoDesc">危険メーターに追われながら解き続ける</small>
          <em id="dojo-best" class="menu-best"></em>
        </button>
        <div class="menu-grid">
          <button id="btn-story" class="menu-btn small story" type="button">
            <b data-t="story">ストーリー</b><small id="story-sub" data-t="storyDesc">気体の精たちと対決</small>
          </button>
          <button id="btn-ta" class="menu-btn small" type="button">
            <b data-t="ta">タイムアタック</b><small data-t="taDesc">60秒で何回ジャストできるか</small>
          </button>
          <button id="btn-daily" class="menu-btn small" type="button">
            <b data-t="daily">今日の5問</b><small id="daily-sub" data-t="dailyDesc">全員が同じ5問</small>
          </button>
          <button id="btn-practice" class="menu-btn small" type="button">
            <b data-t="practice">練習室</b><small data-t="practiceDesc">段階を選んで、じっくり解く</small>
          </button>
          <button id="btn-collection" class="menu-btn small" type="button">
            <b data-t="collection">図鑑</b><small id="collection-sub" data-t="collectionDesc">集めた絵柄を眺める</small>
            <em id="pack-badge" class="pack-badge" hidden></em>
          </button>
          <button id="btn-records" class="menu-btn small" type="button">
            <b data-t="records">記録</b><small data-t="recordsDesc">段位・熟練度・称号</small>
          </button>
        </div>
      </div>
    </div>
    <p id="version" class="version">v0.6.0</p>
  </section>

  <!-- ストーリー：章の一覧（単元全体の地図） -->
  <section id="screen-story" class="screen scroll" hidden>
    <header class="topbar">
      <button class="sub-btn" type="button" data-t="back" data-go-home>もどる</button>
      <h2 class="screen-title" data-t="storyTitle">ストーリー</h2>
      <div class="topbar-right">
        <button class="lang-btn" type="button" data-lang-toggle aria-label="言語 / Language"><span data-l="ja">JP</span><span data-l="en">EN</span></button>
        <button class="icon-btn" type="button" data-mute-toggle aria-label="音"></button>
      </div>
    </header>
    <p class="story-note" data-t="storyMapNote"></p>
    <div id="face-picker" class="face-picker"></div>
    <div id="chapter-list" class="chapter-list"></div>
  </section>

  <!-- 会話と解説 -->
  <section id="screen-talk" class="screen" hidden>
    <div class="talk-top">
      <span id="talk-chapter" class="talk-chapter"></span>
      <div class="topbar-right">
        <button class="lang-btn" type="button" data-lang-toggle aria-label="言語 / Language"><span data-l="ja">JP</span><span data-l="en">EN</span></button>
        <button id="btn-skip" class="sub-btn" type="button" data-t="skip">スキップ</button>
      </div>
    </div>
    <div id="talk-stage" class="talk-stage">
      <canvas id="talk-char" class="talk-char" aria-hidden="true"></canvas>
      <div id="lesson" class="lesson" hidden>
        <p id="lesson-ref" class="lesson-ref"></p>
        <h3 id="lesson-title"></h3>
        <div class="lesson-demo"><canvas id="lesson-bombe"></canvas></div>
        <p id="lesson-state" class="lesson-state num"></p>
        <p id="lesson-text" class="lesson-text"></p>
      </div>
    </div>
    <div id="bubble" class="bubble">
      <b id="bubble-name"></b>
      <p id="bubble-text"></p>
      <span class="bubble-next" data-t="tapNext"></span>
    </div>
  </section>

  <!-- 確認問題（説明してみよう） -->
  <section id="screen-quiz" class="screen scroll" hidden>
    <header class="topbar">
      <button id="btn-quiz-back" class="sub-btn" type="button" data-t="back" hidden>もどる</button>
      <div class="topbar-right">
        <button class="lang-btn" type="button" data-lang-toggle aria-label="言語 / Language"><span data-l="ja">JP</span><span data-l="en">EN</span></button>
        <button class="icon-btn" type="button" data-mute-toggle aria-label="音"></button>
      </div>
    </header>
    <div class="quiz-wrap">
      <p class="quiz-head"><b data-t="quizTitle"></b><span id="quiz-count"></span></p>
      <p id="quiz-ref" class="lesson-ref"></p>
      <p id="quiz-q" class="quiz-q"></p>
      <div id="quiz-choices" class="quiz-choices"></div>
      <div id="quiz-feedback" class="quiz-feedback" hidden>
        <b id="quiz-verdict"></b>
        <p id="quiz-explain"></p>
      </div>
    </div>
    <div class="result-buttons">
      <button id="btn-quiz-next" class="duel-btn" type="button" hidden></button>
    </div>
  </section>

  <!-- 記録：段位、自己ベスト、熟練度マップ、称号 -->
  <section id="screen-records" class="screen scroll" hidden>
    <header class="topbar">
      <button class="sub-btn" type="button" data-t="back" data-go-home>もどる</button>
      <h2 class="screen-title" data-t="records">記録</h2>
      <div class="topbar-right">
        <button class="lang-btn" type="button" data-lang-toggle aria-label="言語 / Language"><span data-l="ja">JP</span><span data-l="en">EN</span></button>
        <button class="icon-btn" type="button" data-mute-toggle aria-label="音"></button>
      </div>
    </header>
    <div id="records-body" class="records-body"></div>
  </section>

  <!-- 図鑑 -->
  <section id="screen-collection" class="screen scroll" hidden>
    <header class="topbar">
      <button class="sub-btn" type="button" data-t="back" data-go-home>もどる</button>
      <h2 class="screen-title" data-t="collection">図鑑</h2>
      <div class="topbar-right">
        <button class="lang-btn" type="button" data-lang-toggle aria-label="言語 / Language"><span data-l="ja">JP</span><span data-l="en">EN</span></button>
        <button class="icon-btn" type="button" data-mute-toggle aria-label="音"></button>
      </div>
    </header>
    <p id="collection-count" class="collection-count"></p>
    <button id="btn-open-pending" class="duel-btn open-pending" type="button" hidden></button>
    <div id="collection-grid" class="collection-grid"></div>
  </section>

  <!-- カードパックを開ける -->
  <section id="screen-pack" class="screen" hidden>
    <div class="corner"><span></span><div class="corner-right"><button class="lang-btn" type="button" data-lang-toggle aria-label="言語 / Language"><span data-l="ja">JP</span><span data-l="en">EN</span></button><button class="icon-btn" type="button" data-mute-toggle aria-label="音"></button></div></div>
    <div class="pack-wrap">
      <h2 class="pack-title" data-t="packTitle"></h2>
      <p class="pack-hint" data-t="tapToOpen"></p>
      <div id="pack-cards" class="pack-cards"></div>
      <p class="pack-free" data-t="packFree"></p>
    </div>
    <div class="result-buttons">
      <button id="btn-pack-all" class="sub-btn" type="button" data-t="openAll"></button>
      <button id="btn-pack-next" class="duel-btn" type="button" data-t="packNext" hidden></button>
    </div>
  </section>

  <!-- 練習室：段階を選ぶ -->
  <section id="screen-select" class="screen" hidden>
    <header class="topbar">
      <button id="btn-select-back" class="sub-btn" type="button" data-t="back">もどる</button>
      <h2 class="screen-title" data-t="practice">練習室</h2>
      <div class="topbar-right">
        <button class="lang-btn" type="button" data-lang-toggle aria-label="言語 / Language"><span data-l="ja">JP</span><span data-l="en">EN</span></button>
        <button class="icon-btn" type="button" data-mute-toggle aria-label="音"></button>
      </div>
    </header>
    <div class="assist-wrap">
      <div class="seg" role="radiogroup">
        <button id="btn-assist-off" type="button" role="radio" data-t="assistOff">補助なし</button>
        <button id="btn-assist-on" type="button" role="radio" data-t="assistOn">補助あり</button>
      </div>
      <p class="assist-hint" data-t="assistHint"></p>
    </div>
    <p class="section-label" data-t="chooseStage"></p>
    <div id="stage-grid" class="stage-grid"></div>
    <button id="btn-kantei" class="menu-btn kantei-btn" type="button">
      <b data-t="kantei">分子量の鑑定</b><small id="kantei-sub" data-t="kanteiDesc">M = mRT/(pV) で気体を見分ける</small>
    </button>
  </section>

  <!-- プレイ画面（練習室と道場で共通） -->
  <section id="screen-play" class="screen" hidden>
    <div id="fever-bar" class="fever-bar"><i></i></div>
    <header class="topbar">
      <div class="hud-practice">
        <div class="stat"><span data-t="stageLabel"></span><b id="stage-num">1</b></div>
        <div class="stat"><span data-t="justLabel"></span><b id="just-count" class="num">0</b></div>
      </div>
      <div class="hud-generic">
        <div class="hud-score"><span id="hud-a-label"></span><b id="hud-a" class="num">0</b></div>
        <div class="hud-score"><span id="hud-b-label"></span><b id="hud-b" class="num">0</b></div>
      </div>
      <div class="hud-dojo">
        <div class="hud-score"><span data-t="scoreLabel"></span><b id="score" class="num">0</b></div>
        <div class="hud-chain"><span data-t="chainLabel"></span><b id="chain" class="num">0</b><i class="chain-bar"><i id="chain-fill"></i></i></div>
      </div>
      <div class="topbar-right">
        <button class="lang-btn" type="button" data-lang-toggle aria-label="言語 / Language"><span data-l="ja">JP</span><span data-l="en">EN</span></button>
        <button class="icon-btn" type="button" data-mute-toggle aria-label="音"></button>
        <button id="btn-home" class="icon-btn" type="button" aria-label="ホームへ">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M3 11 12 3l9 8v10h-6v-6H9v6H3z" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/></svg>
        </button>
      </div>
    </header>

    <div id="vs-bar" class="vs-bar" hidden>
      <canvas id="vs-face" class="vs-face" aria-hidden="true"></canvas>
      <div class="vs-rows">
        <div class="vs-row"><span id="vs-name"></span><i class="vs-track"><i id="vs-opp"></i></i><b id="vs-opp-n" class="num">0</b></div>
        <div class="vs-row me"><span data-t="you"></span><i class="vs-track"><i id="vs-me"></i></i><b id="vs-me-n" class="num">0</b></div>
      </div>
    </div>
    <div class="target-card">
      <div id="target-label" class="target-label" data-t="targetLabel"></div>
      <div id="target-text" class="target-value num"></div>
      <div id="score-pop" class="score-pop num"></div>
    </div>
    <div id="hint" class="hint" aria-live="polite"></div>

    <div class="bombe-area">
      <canvas id="bombe"></canvas>
      <div id="danger" class="danger" aria-hidden="true">
        <span class="danger-label" data-t="dangerLabel"></span>
        <div class="danger-tube"><div id="danger-fill" class="danger-fill"></div></div>
        <b id="danger-num" class="danger-num num">0</b>
      </div>
      <div id="stamps" class="stamps" aria-live="polite"></div>
      <div id="banner" class="banner"></div>
    </div>
    <div id="state-text" class="state-text num"></div>
    <div id="message" class="message" aria-live="polite"></div>

    <div id="field" class="field"></div>
    <div class="action-row">
      <button id="btn-reroll" class="sub-btn" type="button" data-t="reroll"></button>
      <button id="btn-duel" class="duel-btn" type="button" data-t="duel" disabled></button>
    </div>

    <div id="hand" class="hand"></div>
  </section>

  <!-- 道場の結果 -->
  <section id="screen-result" class="screen" hidden>
    <div class="corner"><span></span><div class="corner-right"><button class="lang-btn" type="button" data-lang-toggle aria-label="言語 / Language"><span data-l="ja">JP</span><span data-l="en">EN</span></button><button class="icon-btn" type="button" data-mute-toggle aria-label="音"></button></div></div>
    <div class="result-wrap">
      <h2 id="result-title" class="result-title"></h2>
      <p class="result-label" data-t="scoreLabel"></p>
      <p id="result-score" class="result-score num">0</p>
      <p id="result-best" class="result-best"></p>
      <div id="result-exp" class="result-exp" hidden>
        <div class="result-exp-top"><span data-t="resExp"></span><b id="result-exp-gain" class="num"></b></div>
        <div class="result-exp-rank"><b id="result-rank"></b><i class="rank-bar big"><i id="result-rank-fill"></i></i></div>
        <p id="result-rank-note" class="result-rank-note"></p>
      </div>
      <div id="result-stats" class="result-stats"></div>
      <div id="result-titles" class="result-titles"></div>
      <div id="result-friend" class="result-friend" hidden>
        <canvas id="friend-canvas" class="friend-canvas" aria-hidden="true"></canvas>
        <b id="friend-text"></b>
        <small data-t="friendNote"></small>
        <button id="btn-use-face" class="sub-btn" type="button" data-t="useAsFace"></button>
      </div>
      <div class="result-mistakes">
        <p class="section-label" data-t="resMistakes"></p>
        <div id="result-mistakes"></div>
      </div>
    </div>
    <div class="result-buttons">
      <button id="btn-open-pack" class="duel-btn" type="button" hidden></button>
      <button id="btn-retry" class="duel-btn" type="button" data-t="retry"></button>
      <button id="btn-result-home" class="sub-btn" type="button" data-t="toHome"></button>
    </div>
  </section>

  <!-- 一時停止 -->
  <div id="pause" class="overlay" hidden>
    <div class="panel">
      <h3 data-t="pauseTitle"></h3>
      <button id="btn-resume" class="duel-btn" type="button" data-t="resume"></button>
      <button id="btn-quit" class="sub-btn" type="button" data-t="quit"></button>
    </div>
  </div>

  <!-- 絵柄の詳しい表示（図鑑） -->
  <div id="art-detail" class="overlay" hidden>
    <div class="panel art-panel">
      <div id="art-big" class="art-big"></div>
      <h3 id="art-name"></h3>
      <p id="art-meta" class="art-meta"></p>
      <button id="btn-set-back" class="sub-btn wide" type="button"></button>
      <button id="btn-set-bombe" class="sub-btn wide" type="button"></button>
      <button id="btn-art-close" class="duel-btn" type="button" data-t="close"></button>
    </div>
  </div>

  <div id="toast" class="toast" aria-live="polite"></div>
  <div id="vignette" class="vignette" aria-hidden="true"></div>
  <div id="flash" class="flash" aria-hidden="true"></div>
  <canvas id="fx" class="fx" aria-hidden="true"></canvas>

  <!-- 読み込みに失敗したときのお知らせ -->
  <div id="boot-error" class="boot-error" hidden>
    <p><b>読み込みに失敗しました</b><br>古いファイルが残っている可能性があります。<br>1〜2分待ってから、下のボタンを押してください。</p>
    <p><b>Failed to load.</b><br>Please wait a minute and reload.</p>
    <button type="button" onclick="location.reload()">再読み込み / Reload</button>
  </div>

  <noscript>このゲームを遊ぶには JavaScript を有効にしてください。</noscript>
  <script type="module" src="src/main.js?v=0.6.0"></script>
</body>
</html>
